<!DOCTYPE html>

    <style>
        body {
            font-family: 'Mali', cursive;
            background-color: #5bb3a2;
            touch-action: manipulation;
            user-select: none;
        }

        .game-board {
            background-color: #fff8e8;
            border-radius: 36px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            position: relative;
            border: 4px solid #f3e5c8;
        }

        /* Number button styling */
        .num-btn {
            background: linear-gradient(135deg, #ffa8a8 0%, #ffe3e3 100%);
            border: 2px solid #ff6b6b;
            color: #c92a2a;
            box-shadow: 0 4px 0 #ff6b6b;
            transition: all 0.1s ease;
        }
        
        .num-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #ff6b6b;
        }
        
        .num-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #ff6b6b;
        }

        /* Input field styling */
        .digit-input {
            width: 42px;
            height: 52px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            border: 2px solid #b1b1b1;
            border-radius: 10px;
            background-color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
            -moz-appearance: textfield;
        }
        .digit-input::-webkit-outer-spin-button,
        .digit-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .digit-input:focus {
            border-color: #2b8a3e;
            background-color: #f4fce3;
            box-shadow: 0 0 0 3px rgba(43, 138, 62, 0.25);
        }

        .digit-input.correct {
            border-color: #2b8a3e;
            color: #2b8a3e;
            background-color: #ebfbee;
            pointer-events: none;
        }

        .digit-input.incorrect {
            border-color: #e03131;
            color: #e03131;
            background-color: #fff5f5;
            animation: shake 0.4s ease-in-out;
        }

        .strikethrough {
            position: relative;
        }
        .strikethrough::after {
            content: '';
            position: absolute;
            top: 45%;
            left: -10%;
            width: 120%;
            height: 3px;
            background-color: #e03131;
            transform: rotate(-25deg);
            border-radius: 2px;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .math-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }

        .math-cell {
            width: 42px;
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            position: relative;
        }

        .question-tab {
            transition: all 0.2s ease;
        }
        .question-tab.active {
            background-color: #fcc419;
            color: #212529;
            box-shadow: 0 4px 10px rgba(252, 196, 25, 0.4);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 md:p-6">

    <script>
        // Web Audio Synthesizer for cute sound effects
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playPop() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },
            playError() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.setValueAtTime(180, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            },
            playFanfare() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.12);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.12);
                    osc.stop(this.ctx.currentTime + idx * 0.12 + 0.3);
                });
            }
        };

        function switchQuestion(qNum) {
            currentQ = qNum;

            completedCount = 0;

        function renderWorkingArea() {
            const area = document.getElementById('working-area');
            const qData = questionsData[currentQ];

            if (qData.type === 'vertical') {

                            <!-- Carry Notes -->

        function setupStepInputs() {
            const stepPrefix = currentStage === 1 ? 's1' : 's2';
            const inputs = Array.from(document.querySelectorAll(`input[data-step="${currentStage}"]`));
            activeInputsList = inputs;

            inputs.forEach((input, index) => {
                input.disabled = (currentStage === 2 && document.getElementById('step2-container').classList.contains('pointer-events-none'));
                
                input.addEventListener('focus', () => {
                    activeInput = input;
                });

                input.addEventListener('input', (e) => {
                    let val = e.target.value.replace(/[^0-9]/g, '');
                    if (val.length > 1) val = val.slice(-1);
                    e.target.value = val;
                    if (val !== '') {
                        validateDigit(input, val);
                    }
                });
            });

            // Auto focus rightmost input (units column first)
            if (inputs.length > 0) {
                const startInput = inputs[inputs.length - 1];
                activeInput = startInput;
                if (!startInput.disabled) {
                    setTimeout(() => startInput.focus(), 100);
                }
            }
        }

        function validateDigit(input, val) {
            const expected = input.getAttribute('data-ans');

            if (val === expected) {
                // Correct Digit
                AudioFX.playPop();
                input.classList.remove('incorrect');
                input.classList.add('correct', 'animate-pop');
                input.disabled = true;
                completedCount++;

                // Visual helpers for borrowing / carrying
                handleVisualStepHelpers(input.id);

                // Check if step finished
                if (completedCount === activeInputsList.length) {
                    if (currentStage === 1) {
                        finishStage1();
                    } else {
                        finishStage2();
                    }
                } else {
                    // Move focus to next input to the left
                    const idx = activeInputsList.indexOf(input);
                    if (idx > 0) {
                        activeInput = activeInputsList[idx - 1];
                        activeInput.focus();
                    }
                }
            } else {
                // Incorrect Digit
                AudioFX.playError();
                input.classList.add('incorrect');
                setTimeout(() => {
                    input.classList.remove('incorrect');
                    input.value = '';
                }, 450);
            }
        }

        function handleVisualStepHelpers(inputId) {
            // Q1 Step 1 Borrowing
            if (currentQ === 1 && currentStage === 1) {
                if (inputId === 's1-100s') { // 12 - 4 = 8
                    document.getElementById('b-1000').classList.remove('opacity-0');
                    document.getElementById('d-1000').classList.add('strikethrough');
                }
                if (inputId === 's1-10s') { // Borrowed for 12
                    document.getElementById('b-100').classList.remove('opacity-0');
                    document.getElementById('d-10').classList.add('strikethrough');
                }
            }
            // Q1 Step 2 Carrying
            if (currentQ === 1 && currentStage === 2) {
                if (inputId === 's1-1s') { // 4 + 6 = 10, carry 1
                    document.getElementById('c-10').classList.remove('opacity-0');
                }
            }
            // Q2 Step 2 Borrowing
            if (currentQ === 2 && currentStage === 2) {
                if (inputId === 's2-1s') {
                    document.getElementById('b-1').classList.remove('opacity-0');
                    document.getElementById('b-10').classList.remove('opacity-0');
                    document.getElementById('d-1').classList.add('strikethrough');
                    document.getElementById('d-10').classList.add('strikethrough');
                }
                if (inputId === 's2-10s') {
                    document.getElementById('b-100').classList.remove('opacity-0');
                    document.getElementById('d-100').classList.add('strikethrough');
                }
                if (inputId === 's2-100s') {
                    document.getElementById('b-1000').classList.remove('opacity-0');
                    document.getElementById('d-1000').classList.add('strikethrough');
                }
            }
        }

        function finishStage1() {
            showToast("เก่งมาก! ไปทำขั้นตอนถัดไปกันต่อเลย ✨");
            
            // Show bracket answer note at header
            const bracketNote = document.getElementById('bracket-note');
            if (bracketNote) {
                bracketNote.classList.remove('opacity-0', '-translate-y-2');
            }

            setTimeout(() => {
                currentStage = 2;
                completedCount = 0;

                const step2Container = document.getElementById('step2-container');
                step2Container.classList.remove('opacity-40', 'pointer-events-none');

                // If Q2 side-by-side, transfer values
                if (currentQ === 2) {
                    document.getElementById('val-100').textContent = document.getElementById('s1-100s').value;
                    document.getElementById('val-10').textContent = document.getElementById('s1-10s').value;
                    document.getElementById('val-1').textContent = document.getElementById('s1-1s').value;
                }

                setupStepInputs();
            }, 800);
        }

        function finishStage2() {
            AudioFX.playFanfare();
            showToast("ยอดเยี่ยมมาก! คำนวณถูกต้องทั้งหมด 🎉", 3000);

            // Fill final box
            const finalBox = document.getElementById('final-box');
            if (finalBox) {
                finalBox.textContent = questionsData[currentQ].finalVal;
                finalBox.classList.add('text-green-600', 'bg-green-100', 'border-green-600', 'animate-pop');
            }

            // Show footer Thai numeral answer
            document.getElementById('final-answer-section').classList.remove('opacity-0');

            // Trigger Confetti
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function pressKey(num) {
            if (activeInput && !activeInput.disabled) {
                activeInput.value = num;
                validateDigit(activeInput, num);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                if (activeInput && !activeInput.disabled) {
                    activeInput.value = e.key;
                    validateDigit(activeInput, e.key);
                }
            }
        });

        function showToast(msg, duration = 1600) {
            const toast = document.getElementById('feedback-msg');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            toast.classList.add('animate-pop');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('animate-pop');
            }, duration);
        }

        // Initialize on Load
        window.onload = () => {
            switchQuestion(1);
        };
    </script>
</body>
</html>
